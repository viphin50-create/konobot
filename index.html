<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рамён-Помощник КОНО</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Настройка шрифта Inter и стилей для красивого внешнего вида -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* Цвет фона, совпадающий с GIF и карточкой */
            background-color: #fcf8e3; 
            display: flex;
            justify-content: center;
            align-items: center;
            /* Убеждаемся, что приложение занимает всю доступную высоту (например, в мини-аппе) */
            min-height: 100vh;
            margin: 0; 
            position: relative;
        }
        
        /* --- СТИЛИ ДЛЯ КАРТОЧКИ ПРИЛОЖЕНИЯ (ЭФФЕКТ СТЕКЛА) --- */
        .glass-card {
            background-color: #fcf8e3; 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); 
        }
        /* --- КОНЕЦ СТИЛЕЙ КАРТОЧКИ --- */

        /* Основной контейнер */
        #main-app-content {
            margin: 0 !important;
            max-width: 100% !important;
        }

        /* Область контента */
        #main-interaction-area {
            min-height: 250px; 
        }

        .user-button {
            transition: all 0.2s;
        }
        .user-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        
        /* Анимации */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стили для карточки блюда (миниатюра) */
        .noodle-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .noodle-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Стили для модального окна */
        #modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        #modal-content {
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Основной контент приложения -->
    <!-- Класс 'hidden' остается, чтобы избежать мерцания до загрузки данных -->
    <div id="main-app-content" class="w-full max-w-lg mx-auto p-6 md:p-8 rounded-2xl glass-card hidden">
        <!-- Header -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-gray-800">🍜 Рамён-Помощник</h1>
            <p class="text-sm text-gray-500">Ваш личный консультант по меню</p>
        </header>

        <!-- Main Dynamic Interaction Area -->
        <div id="main-interaction-area" class="space-y-6 pb-4 fade-in">
            <div id="loading-indicator" class="flex justify-center p-4 hidden">
                <div class="spinner"></div>
                <span class="ml-3 text-gray-500">Загрузка меню...</span>
            </div>
        </div>

        <!-- Control Buttons Area -->
        <div id="control-area" class="mt-6 pt-4 border-t border-gray-200 flex justify-center">
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО (MODAL) -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden flex justify-center items-center p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-3xl shadow-2xl transform scale-95 transition-transform duration-300">
            <div id="modal-body"></div>
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-white rounded-full p-1 shadow-md hover:bg-gray-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- DATA AND CONFIGURATION ---
        const PLACEHOLDER_IMAGE = "https://placehold.co/100x100/1e293b/ffffff?text=Фото+Нет";
        
        const optionIcons = {
            "С бульоном": "🍲", "Без бульона": "🍜",
            "Не острая": "🟢", "Средняя": "🌶️🌶️", "Острая": "🌶️🌶️🌶️",
            "Черные бобы": "⚫", "Морепродукты": "🦐", "Кимчи": "🥬", "Курица": "🍗", "Говядина": "🥩", "Паста": "🍝", "Карбонара": "🧀",
            "default": "✨"
        };

        const STATIC_RAMEN_DB = [
            { id: 'chapagetti', name_ru: 'Чапагетти', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Черные бобы', toppings_ru: ['Нарутомаки', 'Сасими', 'Морепродукты'] },
            { id: 'anson_tongmyeon', name_ru: 'Ансон Тонмён', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка', 'Лук жареный'] },
            { id: 'kimchi_ramen', name_ru: 'Кимчи Рамен', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Кимчи', toppings_ru: ['Креветка', 'Нарутомаки'] },
            { id: 'puldak_ramen', name_ru: 'Пулдак Рамён', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Курица', toppings_ru: ['Лук жареный'] },
            { id: 'saeu_tangmyeon', name_ru: 'Сэу Танмён (Креветочный)', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка'] },
            { id: 'tushed_chicken', name_ru: 'Тушеная курица', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Курица', toppings_ru: [] },
            { id: 'neoguri', name_ru: 'Неогури', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка'] },
            { id: 'pasta_with_garlic', name_ru: 'Паста с чесноком', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Паста', toppings_ru: ['Лук жареный'] },
            { id: 'pasta_with_cheese', name_ru: 'Паста с сыром', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Карбонара', toppings_ru: ['Лук вареный'] },
            { id: 'chan_ramen', name_ru: 'Чан Рамён', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: [] },
            { id: 'ship_ramen_spicy', name_ru: 'Шип Рамён острый', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Средняя', baseFlavor_ru: 'Говядина', toppings_ru: ['Черные грибы', 'Лук жареный'] }, 
            { id: 'carbonara', name_ru: 'Карбонара', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Карбонара', toppings_ru: [] },
        ];

        const questionFlow = [
            { key: 'preparation_ru', prompt_ru: "С чего начнем? Вы любите рамён <b>с бульоном</b> или предпочитаете <b>без бульона</b>?", options_ru: ["С бульоном", "Без бульона"] },
            { key: 'spiceLevel_ru', prompt_ru: "Как насчет остроты? Выберите свой уровень:", options_ru: ["Не острая", "Средняя", "Острая"] },
            { key: 'baseFlavor_ru', prompt_ru: "Отлично. А какой вкус вы ищете сегодня?", options_source: "dynamic_from_filter" }
        ];

        // --- GIF CONFIG ---
        const videoUrls = {
            'greeting': 'https://image2url.com/gifs/1764696020110-4cd7d218-14c8-4f51-8233-14208e95f64e.gif', 
            'questionGif': 'https://image2url.com/gifs/1764696307418-26635021-448f-4588-b4d1-acb956135531.gif',
            'thinking': 'https://image2url.com/gifs/1764697051373-6b6eb8f1-8dbe-4b79-b965-f4d2bd98a068.gif',
            'sad': 'https://image2url.com/gifs/1764697427429-cfed7fba-1750-4b06-8c30-282e093046d4.gif'
        };

        // --- STATE ---
        let noodleDatabase = []; 
        let currentState = { step: 0, filters: {}, availableNoodles: [] };
        
        // --- DOM ELEMENTS ---
        const mainArea = document.getElementById('main-interaction-area');
        const controlArea = document.getElementById('control-area');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalBody = document.getElementById('modal-body');

        // --- UTILITY ---
        async function loadNoodleDatabase() {
            // Имитация загрузки данных
            return new Promise(resolve => setTimeout(() => resolve(STATIC_RAMEN_DB), 100));
        }
        function setMainContent(html) { mainArea.innerHTML = html; }

        function createButton(text, onClick, classes = 'bg-white text-gray-800 border-2 border-indigo-200 hover:bg-indigo-100 font-medium py-3 px-6 rounded-xl user-button flex-grow text-center flex items-center justify-center') {
            const btn = document.createElement('button');
            const icon = optionIcons[text] || optionIcons['default'];
            btn.innerHTML = `<span class="text-xl mr-2">${icon}</span> ${text}`;
            btn.className = classes;
            btn.onclick = onClick;
            return btn;
        }

        // --- UI RENDERING ---
        function renderStartScreen() {
            const gifUrl = videoUrls['greeting'];
            let contentHTML = `
                <div class="text-center p-4">
                    <div class="flex justify-center mb-6">
                        <img src="${gifUrl}" alt="Маскот Коно" class="w-36 h-36 rounded-full object-cover border-4 border-indigo-300 p-0.5 shadow-lg">
                    </div>
                    <h2 class="text-2xl font-extrabold text-indigo-700 mb-2">👋 Привет! Я Коно, твой Рамён-Помощник.</h2>
                    <p class="text-gray-500 mb-6">Нажми "Начать выбор", чтобы найти идеальное блюдо для тебя.</p>
                </div>
            `;
            setMainContent(contentHTML);
            renderControls();
        }

        function renderQuestionStep(question, options) {
            const gifUrl = videoUrls['questionGif']; 
            let questionHTML = `
                <div class="flex items-start mb-6 space-x-4 fade-in">
                    <div class="flex-shrink-0 w-36 h-40 overflow-hidden rounded-xl shadow-lg bg-white">
                        <img src="${gifUrl}" alt="Маскот Коно" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-grow bg-indigo-50 p-4 rounded-xl rounded-tl-none shadow-lg border-2 border-indigo-200">
                        <p class="text-sm font-bold text-indigo-700 mb-1">КОНО (Шаг ${currentState.step}/${questionFlow.length})</p>
                        <p class="text-xl font-semibold text-gray-800">${question.prompt_ru}</p>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="text-sm text-gray-500 mb-3 ml-1">Выберите свой ответ:</p>
                    <div id="option-buttons" class="flex flex-wrap gap-3"></div>
                </div>
            `;
            setMainContent(questionHTML);
            renderControls();
            const optionButtonsArea = document.getElementById('option-buttons');
            options.forEach(option => {
                optionButtonsArea.appendChild(createButton(option, () => handleAnswer(question.key, option)));
            });
        }

        // --- MODAL LOGIC ---
        function openModal(noodleId) {
            const noodle = noodleDatabase.find(n => n.id === noodleId);
            if (!noodle) return;

            const toppingsList = noodle.toppings_ru.length > 0 
                ? noodle.toppings_ru.map(t => `<li class="flex items-start"><span class="mr-2 text-green-500">✓</span>${t}</li>`).join('')
                : '<li class="text-gray-500">Любой топпинг по вашему вкусу!</li>';

            const html = `
                <div class="relative">
                    <div class="h-56 w-full bg-gray-200 overflow-hidden">
                         <img src="${noodle.image}" onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6">
                        <h3 class="text-2xl font-extrabold text-gray-800 mb-1">${noodle.name_ru}</h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-md font-medium">${noodle.preparation_ru}</span>
                            <span class="px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded-md font-medium">${noodle.spiceLevel_ru}</span>
                            <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-md font-medium">${noodle.baseFlavor_ru}</span>
                        </div>
                        <div class="mt-4 bg-green-50 p-4 rounded-xl border border-green-100">
                            <p class="font-bold text-green-800 mb-2 text-sm uppercase tracking-wide">Рекомендую попробовать с нашими топпингами:</p>
                            <ul class="space-y-1 text-sm text-gray-700">${toppingsList}</ul>
                        </div>
                    </div>
                    <div class="p-4 bg-gray-50 border-t border-gray-100 text-center rounded-b-3xl">
                        <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded-xl w-full transition-colors">Отлично, беру!</button>
                    </div>
                </div>
            `;
            modalBody.innerHTML = html;
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modalOverlay.classList.add('hidden'); }, 300);
        }

        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        // --- THINKING SCREEN ---
        function showThinkingAndRenderResults() {
            // Показываем экран "Думаю"
            const thinkingHTML = `
                <div class="text-center p-8 flex flex-col items-center justify-center min-h-[300px] fade-in">
                    <div class="flex justify-center mb-6">
                        <img src="${videoUrls['thinking']}" alt="Маскот Коно думает" 
                             class="w-48 h-48 rounded-full object-cover border-4 border-indigo-400 p-0.5 shadow-xl">
                    </div>
                    <div class="bg-indigo-50 p-4 rounded-xl shadow-lg border-2 border-indigo-200">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">🤔 Я вас понял!</h2>
                        <p class="text-xl text-indigo-600 font-semibold">Дайте подумать...</p>
                    </div>
                    <div class="mt-4 flex items-center">
                        <!-- Можно добавить спиннер или просто текст -->
                        <p class="text-sm text-gray-500">Генерирую идеальный выбор...</p>
                    </div>
                </div>
            `;
            
            setMainContent(thinkingHTML);
            renderControls(); 

            // После задержки, переходим к результатам
            setTimeout(() => {
                currentState.step = -1; // Устанавливаем статус "результаты"
                renderResult();
            }, 3000); // 3 секунды паузы
        }

        // --- RENDER RESULTS AS CARDS ---
        function renderResult() {
            const list = currentState.availableNoodles;

            // Сценарий 1: Ошибка, база данных пуста
            if (noodleDatabase.length === 0) {
                 let errorHTML = `<div class="p-6 bg-red-100 border border-red-300 rounded-xl text-center"><h2 class="text-2xl font-bold text-red-800 mb-3">⚠️ Ошибка</h2><p class="text-gray-700">База данных пуста.</p></div>`;
                 setMainContent(errorHTML);
                 renderControls();
                 return;
            }

            // Сценарий 2: Ошибка, ничего не найдено
            if (list.length === 0) {
                 const gifUrl = videoUrls['sad'];
                 let errorHTML = `
                    <div class="text-center p-8 fade-in">
                        <div class="flex justify-center mb-6">
                            <img src="${gifUrl}" class="w-48 h-48 rounded-full object-cover border-4 border-red-400 p-0.5 shadow-xl" alt="Маскот Коно грустит">
                        </div>
                        <div class="bg-red-100 p-4 rounded-xl border-2 border-red-300">
                            <h2 class="text-2xl font-bold text-red-800 mb-2">😭 О нет!</h2>
                            <p class="text-gray-700">По вашим критериям ничего не нашлось. Попробуйте снова!</p>
                        </div>
                    </div>
                 `;
                 currentState.step = -2; // Устанавливаем статус ошибки для отображения кнопки "Начать сначала"
                 setMainContent(errorHTML);
                 renderControls();
                 return;
            }

            // Сценарий 3: Успешный результат
            let resultHTML = `
                <div class="text-center mb-6 fade-in">
                    <div class="flex justify-center mb-4">
                         <img src="${videoUrls['greeting']}" class="w-32 h-32 rounded-full object-cover border-4 border-green-300 p-0.5 shadow-lg" alt="Маскот Коно рад">
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Готово! Вот что я нашел:</h2>
                    <p class="text-sm text-gray-500 mt-1">Нажмите на карточку, чтобы узнать детали.</p>
                </div>
                <div class="grid grid-cols-2 gap-4 fade-in pb-20">
            `;

            list.forEach(noodle => {
                resultHTML += `
                    <div class="glass-card rounded-2xl shadow-md overflow-hidden flex flex-col h-full noodle-card" onclick="openModal('${noodle.id}')">
                        <div class="h-32 w-full bg-gray-100 relative">
                            <img src="${noodle.image}" onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" class="w-full h-full object-cover">
                        </div>
                        <div class="p-3 flex-grow flex flex-col justify-between bg-white/50 backdrop-blur-sm"> <!-- Светлый полупрозрачный фон для контента карточки -->
                            <h3 class="font-bold text-gray-800 text-sm leading-tight mb-1">${noodle.name_ru}</h3>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="text-[10px] px-1.5 py-0.5 bg-indigo-50 text-indigo-600 rounded border border-indigo-100">${noodle.spiceLevel_ru}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultHTML += `</div>`;
            setMainContent(resultHTML);
            renderControls();
        }

        function renderControls() {
            controlArea.innerHTML = '';
            let button;
            // Кнопка "Начать выбор" только на стартовом экране
            if (currentState.step === 0) {
                button = createButton('Начать выбор', () => {
                    currentState.step = 1;
                    startNextStep();
                }, 'bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-full w-full user-button flex items-center justify-center');
            // Кнопка "Начать сначала" на экранах результатов и ошибки
            } else if (currentState.step < 0) {
                 button = createButton('Начать сначала', restart, 'bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-full user-button flex items-center justify-center');
            } 
            if (button) controlArea.appendChild(button);
        }

        // Обновленная функция startGreeting: мгновенная загрузка и отображение
        async function startGreeting() {
            const mainContent = document.getElementById('main-app-content');
            
            // 1. Загружаем данные
            noodleDatabase = await loadNoodleDatabase();
            currentState.availableNoodles = [...noodleDatabase];
            
            // 2. Сразу показываем главный контент
            mainContent.classList.remove('hidden');

            if (noodleDatabase.length === 0) {
                currentState.step = -2;
                renderResult(); 
            } else {
                currentState.step = 0;
                renderStartScreen(); 
            }
        }

        function handleAnswer(key, value) {
            setMainContent('');
            currentState.filters[key] = value;
            currentState.availableNoodles = currentState.availableNoodles.filter(noodle => noodle[key] === value);
            currentState.step++;
            startNextStep();
        }

        function startNextStep() {
            // Если после фильтрации ничего не осталось
            if (currentState.availableNoodles.length === 0) {
                currentState.step = -2;
                renderResult(); 
                return;
            }

            // Если все вопросы заданы, переходим к экрану "Думаю"
            if (currentState.step > questionFlow.length) {
                showThinkingAndRenderResults(); 
                return;
            }
            
            const currentQuestion = questionFlow[currentState.step - 1];
            let options = currentQuestion.options_ru;
            
            // Динамическая фильтрация опций по оставшимся блюдам
            if (currentQuestion.options_source === "dynamic_from_filter") {
                const remainingFlavors = [...new Set(currentState.availableNoodles.map(n => n[currentQuestion.key]))];
                options = remainingFlavors.sort(); 
            }

            if (options.length === 0) {
                currentState.step = -2;
                renderResult();
                return;
            }

            // Если остался только один вариант, пропускаем вопрос и переходим к следующему шагу
            if (options.length === 1 && currentState.step < questionFlow.length) {
                currentState.filters[currentQuestion.key] = options[0];
                currentState.availableNoodles = currentState.availableNoodles.filter(noodle => noodle[currentQuestion.key] === options[0]);
                currentState.step++;
                startNextStep();
                return;
            } 
            
            // Если вариантов больше одного, показываем вопрос
            renderQuestionStep(currentQuestion, options);
        }

        function restart() {
            currentState = { step: 0, filters: {}, availableNoodles: [] };
            currentState.availableNoodles = [...noodleDatabase];
            renderStartScreen();
        }

        document.addEventListener('DOMContentLoaded', startGreeting);
    </script>
</body>
</html>

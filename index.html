<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рамён-Помощник КОНО</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Настройка шрифта Inter и стилей для красивого внешнего вида -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            /* Цвет фона, совпадающий с GIF и карточкой */
            background-color: #fcf8e3; 
            display: flex;
            justify-content: center;
            align-items: center;
            /* Убеждаемся, что приложение занимает всю доступную высоту (например, в мини-аппе) */
            min-height: 100vh;
            margin: 0; 
            position: relative; /* Добавлено для корректного позиционирования заставки */
        }
        
        /* --- СТИЛИ ДЛЯ КАРТОЧКИ ПРИЛОЖЕНИЯ --- */
        .glass-card {
            background-color: #fcf8e3; 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); 
        }
        /* --- КОНЕЦ СТИЛЕЙ КАРТОЧКИ --- */
        
        /* Стили для заставки (Сделано компактнее и центрировано) */
        #splash-screen {
            background-color: #fcf8e3;
            /* НОВОЕ: Компактный размер и центрирование относительно body */
            position: absolute; 
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 1.5rem; /* Закругление краев */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); 
            
            z-index: 50; /* Поверх всего контента */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Плавный переход для скрытия */
            transition: opacity 0.7s ease-out; 
            overflow: hidden; 
        }
        
        /* Стиль для изображения в заставке (занимает весь контейнер 300x300) */
        #splash-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Убедимся, что основной контент не имеет лишних отступов на мобильных */
        #main-app-content {
            margin: 0 !important;
            max-width: 100% !important;
        }

        /* Custom scrollbar for main content area (if needed) */
        #main-interaction-area {
            min-height: 250px; /* Минимальная высота, чтобы не "прыгало" */
        }
        .user-button {
            transition: all 0.2s;
        }
        .user-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Утилита для скрытия элемента, используем !important для переопределения flex */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Заставка запуска приложения (SPLASH SCREEN) -->
    <div id="splash-screen" class="opacity-100">
        <!-- ИСПОЛЬЗУЕМ GIF -->
        <img id="splash-image" 
               src="https://image2url.com/gifs/1764696570536-12f987ea-6660-42ff-af90-59b247680c26.gif" 
               alt="Анимация маскота Коно"
               class="w-full h-full object-cover">
    </div>
    <!-- КОНЕЦ ЗАСТАВКИ -->

    <!-- Основной контент приложения (скрыт по умолчанию) -->
    <div id="main-app-content" class="w-full max-w-lg mx-auto p-6 md:p-8 rounded-2xl glass-card hidden">
        <!-- Header -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-gray-800">🍜 Рамён-Помощник</h1>
            <p class="text-sm text-gray-500">Ваш личный консультант по меню</p>
        </header>

        <!-- Main Dynamic Interaction Area (Open Space) -->
        <div id="main-interaction-area" class="space-y-6 pb-4 fade-in">
            <!-- Content (Greeting, Questions, Results) will be injected here -->
            <div id="loading-indicator" class="flex justify-center p-4 hidden">
                <div class="spinner"></div>
                <span class="ml-3 text-gray-500">Загрузка меню...</span>
            </div>
        </div>

        <!-- Control Buttons Area (Start/Restart only) -->
        <div id="control-area" class="mt-6 pt-4 border-t border-gray-200 flex justify-center">
            <!-- Start/Restart buttons will be injected here -->
        </div>
    </div>

    <script>
        // --- DATA AND CONFIGURATION ---
        
        // URL-заглушка для отсутствующих фото
        const PLACEHOLDER_IMAGE = "https://placehold.co/100x100/1e293b/ffffff?text=Фото+Нет";
        
        // Карта эмодзи для кнопок выбора
        const optionIcons = {
            // Способ приготовления
            "С бульоном": "🍲",
            "Без бульона": "🍜",
            // Уровень остроты
            "Не острая": "🟢",
            "Средняя": "🌶️🌶️", 
            "Острая": "🌶️🌶️🌶️",
            // Базовый вкус
            "Черные бобы": "⚫",
            "Морепродукты": "🦐",
            "Кимчи": "🥬",
            "Курица": "🍗",
            "Говядина": "🥩",
            "Паста": "🍝",
            "Карбонара": "🧀",
            // Запасная иконка
            "default": "✨"
        };


        // ** СТАТИЧЕСКАЯ БАЗА ДАННЫХ МЕНЮ (ВШИТА В КОД ДЛЯ ИЗБЕЖАНИЯ ОШИБОК СЕТИ/CORS) **
        const STATIC_RAMEN_DB = [
            { id: 'chapagetti', name_ru: 'Чапагетти', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Черные бобы', toppings_ru: ['Нарутомаки', 'Сасими', 'Морепродукты'] },
            { id: 'anson_tongmyeon', name_ru: 'Ансон Тонмён', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка', 'Лук жареный'] },
            { id: 'kimchi_ramen', name_ru: 'Кимчи Рамен', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Кимчи', toppings_ru: ['Креветка', 'Нарутомаки'] },
            { id: 'puldak_ramen', name_ru: 'Пулдак Рамён', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Курица', toppings_ru: ['Лук жареный'] },
            { id: 'saeu_tangmyeon', name_ru: 'Сэу Танмён (Креветочный)', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка'] },
            { id: 'tushed_chicken', name_ru: 'Тушеная курица', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Курица', toppings_ru: [] },
            { id: 'neoguri', name_ru: 'Неогури', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: ['Креветка'] },
            { id: 'pasta_with_garlic', name_ru: 'Паста с чесноком', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Паста', toppings_ru: ['Лук жареный'] },
            { id: 'pasta_with_cheese', name_ru: 'Паста с сыром', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Карбонара', toppings_ru: ['Лук вареный'] },
            { id: 'chan_ramen', name_ru: 'Чан Рамён', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Не острая', baseFlavor_ru: 'Морепродукты', toppings_ru: [] },
            { id: 'ship_ramen_spicy', name_ru: 'Шип Рамён острый', image: PLACEHOLDER_IMAGE, preparation_ru: 'С бульоном', spiceLevel_ru: 'Средняя', baseFlavor_ru: 'Говядина', toppings_ru: ['Черные грибы', 'Лук жареный'] }, 
            { id: 'carbonara', name_ru: 'Карбонара', image: PLACEHOLDER_IMAGE, preparation_ru: 'Без бульона', spiceLevel_ru: 'Острая', baseFlavor_ru: 'Карбонара', toppings_ru: [] },
        ];
        // ** КОНЕЦ СТАТИЧЕСКОЙ БАЗЫ ДАННЫХ **

        // Последовательность вопросов для диалога
        const questionFlow = [
            { key: 'preparation_ru', prompt_ru: "С чего начнем? Вы любите рамён **с бульоном** или предпочитаете **без бульона**?", options_ru: ["С бульоном", "Без бульона"] },
            { key: 'spiceLevel_ru', prompt_ru: "Как насчет остроты? Выберите свой уровень:", options_ru: ["Не острая", "Средняя", "Острая"] },
            { key: 'baseFlavor_ru', prompt_ru: "Отлично. А какой вкус вы ищете сегодня?", options_source: "dynamic_from_filter" }
        ];

        // --- КОНФИГУРАЦИЯ GIF МАСКОТА (3 РАЗНЫХ АНИМАЦИИ) ---
        // 🔑 Launch: Полный экран на старте (URL установлен в HTML)
        const konoLaunchGifUrl = 'https://image2url.com/gifs/1764696570536-12f987ea-6660-42ff-af90-59b247680c26.gif'; 
        // 🔑 Greeting: Аватар на Шаге 0 (Приветствие)
        const konoGreetingGifUrl = 'https://image2url.com/gifs/1764696020110-4cd7d218-14c8-4f51-8233-14208e95f64e.gif';
        // 🔑 Question: Аватар на Шаге 1+ (Выбор)
        const konoQuestionGifUrl = 'https://image2url.com/gifs/1764696307418-26635021-448f-4588-b4d1-acb956135531.gif';
        // 🔑 Result: Аватар для финального экрана
        const konoResultGifUrl = 'https://image2url.com/gifs/1764696953299-dfe22cd0-366c-4b4e-9e36-f35ffd3cdcc1.gif';
        // 🔑 Thinking Process: Новый GIF для промежуточного экрана (пользовательский)
        const konoThinkingProcessGifUrl = 'https://image2url.com/gifs/1764697051373-6b6eb8f1-8dbe-4b79-b965-f4d2bd98a068.gif'; 
        // 🔑 No Match: Новый GIF для экрана "Ничего не нашлось" (по запросу пользователя)
        const konoSadGifUrl = 'https://image2url.com/gifs/1764697427429-cfed7fba-1750-4b06-8c30-282e093046d4.gif'; 
        
        // --- STATE AND DOM ELEMENTS ---
        let noodleDatabase = []; 
        let currentState = {
            step: 0, 
            filters: {},
            availableNoodles: [],
        };

        const mainArea = document.getElementById('main-interaction-area');
        const controlArea = document.getElementById('control-area');
        
        let gifTimeoutId = null; 

        // --- UTILITY FUNCTIONS ---
        
        async function loadNoodleDatabase() {
            return new Promise(resolve => {
                setTimeout(() => resolve(STATIC_RAMEN_DB), 100); 
            });
        }
        
        /**
         * Устанавливает главный контент в интерактивную область.
         */
        function setMainContent(html) {
            mainArea.innerHTML = html;
        }

        /**
         * Создает стандартную кнопку ответа.
         * Добавлены классы для flex-контейнера, чтобы центрировать иконку и текст.
         */
        function createButton(text, onClick, classes = 'bg-white text-gray-800 border-2 border-indigo-200 hover:bg-indigo-100 font-medium py-3 px-6 rounded-xl user-button flex-grow text-center flex items-center justify-center') {
            const btn = document.createElement('button');
            const icon = optionIcons[text] || optionIcons['default'];
            
            // Используем innerHTML для вставки иконки (эмодзи) перед текстом
            btn.innerHTML = `<span class="text-xl mr-2">${icon}</span> ${text}`;
            btn.className = classes;
            btn.onclick = onClick;
            return btn;
        }

        // --- UI RENDERING FUNCTIONS ---
        
        /**
         * Отображает начальный экран или GIF-приветствие.
         */
        function renderStartScreen() {
            // 🔑 Используем Greeting GIF для стартового экрана (Шаг 0)
            const gifUrl = konoGreetingGifUrl;
            
            // Новый HTML для стартового экрана с маскотом-аватаром
            let contentHTML = `
                <div class="text-center p-4">
                    <!-- Mascot as a slightly larger, centered avatar (w-36 h-36) -->
                    <div class="flex justify-center mb-6">
                        <img src="${gifUrl}" alt="Анимация маскота Коно" 
                             onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" 
                             class="w-36 h-36 rounded-full object-cover border-4 border-indigo-300 p-0.5 shadow-lg">
                    </div>
                    
                    <h2 class="text-2xl font-extrabold text-indigo-700 mb-2">👋 Привет! Я Коно, твой Рамён-Помощник.</h2>
                    <!-- Обновленный текст -->
                    <p class="text-gray-500 mb-6">Нажми "Начать выбор", чтобы найти идеальное блюдо для тебя.</p>
                </div>
            `;

            setMainContent(contentHTML);
            renderControls();
        }

        /**
         * Рендерит текущий вопрос и кнопки выбора. (Обновлено для диалогового стиля)
         */
        function renderQuestionStep(question, options) {
            // 🔑 Используем Question GIF для шагов с вопросами (Шаг 1 и далее)
            const gifUrl = konoQuestionGifUrl; 
            
            // HTML для отображения вопроса в формате диалога
            let questionHTML = `
                <!-- DIALOGUE CONTAINER -->
                <div class="flex items-start mb-6 space-x-4 fade-in">
                    
                    <!-- Mascot Character Container (Konu) - УВЕЛИЧЕННЫЕ РАЗМЕРЫ w-36 h-40, БЕЗ РАМКИ -->
                    <div class="flex-shrink-0 w-36 h-40 overflow-hidden rounded-xl shadow-lg bg-white">
                        <img src="${gifUrl}" alt="Маскот Коно" 
                             onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" 
                             class="w-full h-full object-cover">
                    </div>
                    
                    <!-- Speech Bubble (Question) -->
                    <div class="flex-grow bg-indigo-50 p-4 rounded-xl rounded-tl-none shadow-lg border-2 border-indigo-200">
                        <p class="text-sm font-bold text-indigo-700 mb-1">КОНО (Шаг ${currentState.step}/${questionFlow.length})</p>
                        <p class="text-xl font-semibold text-gray-800">${question.prompt_ru}</p>
                    </div>
                </div>
                
                <!-- OPTIONS CONTAINER -->
                <div class="mt-4">
                    <p class="text-sm text-gray-500 mb-3 ml-1">Выберите свой ответ:</p>
                    <div id="option-buttons" class="flex flex-wrap gap-3">
                        <!-- Buttons will be rendered here -->
                    </div>
                </div>
            `;

            setMainContent(questionHTML);
            renderControls(); // Скрываем/показываем управление
            
            const optionButtonsArea = document.getElementById('option-buttons');
            options.forEach(option => {
                const btn = createButton(option, () => handleAnswer(question.key, option));
                optionButtonsArea.appendChild(btn);
            });
        }
        
        /**
         * Отображает промежуточный результат (список из нескольких вариантов) или ошибку.
         */
        function renderResult() {
            let resultHTML = '';
            
            if (currentState.step === -1 && currentState.availableNoodles.length > 0) {
                // УСПЕШНЫЙ ПРОМЕЖУТОЧНЫЙ РЕЗУЛЬТАТ: Отображаем ВСЕ найденные варианты
                const resultCount = currentState.availableNoodles.length;
                
                if (resultCount === 1) {
                    // Если остался 1, сразу переходим к "Думаю"
                    handleNoodleSelection(currentState.availableNoodles[0].id);
                    return;
                } 
                
                resultHTML += `
                    <div class="bg-green-100 p-4 rounded-xl shadow-lg border border-green-300 text-center mb-6">
                        <h2 class="text-2xl font-bold text-green-800">🎉 Отлично!</h2>
                        <p class="text-gray-700 mt-2">Мы нашли **${resultCount}** вариантов, соответствующих вашим критериям. Выберите лучший:</p>
                    </div>
                    <div class="space-y-4">
                `;
                
                currentState.availableNoodles.forEach((noodle) => {
                    const toppingsDisplay = noodle.toppings_ru.length > 0 ? noodle.toppings_ru.join(', ') : 'Нет';
                    resultHTML += `
                        <div class="p-4 bg-white border border-gray-200 rounded-xl shadow-md fade-in flex flex-col sm:flex-row items-center sm:items-start space-y-3 sm:space-y-0 sm:space-x-4">
                            <img src="${noodle.image}" onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" class="w-20 h-20 rounded-lg object-cover flex-shrink-0">
                            <div class="w-full">
                                <h3 class="text-xl font-bold text-indigo-700 mb-2 text-center sm:text-left">${noodle.name_ru}</h3>
                                <div class="grid grid-cols-2 gap-y-1 gap-x-4 text-sm text-gray-700">
                                    <p class="font-medium">Вкус: <span class="font-normal">${noodle.baseFlavor_ru}</span></p>
                                    <p class="font-medium">Острота: <span class="font-normal">${noodle.spiceLevel_ru}</span></p>
                                    <p class="font-medium">Способ: <span class="font-normal">${noodle.preparation_ru}</span></p>
                                    <p class="font-medium col-span-2">Топпинги: <span class="font-normal">${toppingsDisplay}</span></p>
                                </div>
                            </div>
                            <button onclick="handleNoodleSelection('${noodle.id}')" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 px-4 rounded-full mt-3 sm:mt-0 flex-shrink-0 user-button">
                                Выбрать
                            </button>
                        </div>
                    `;
                });
                
                resultHTML += `</div>`;
                setMainContent(resultHTML);

            } else {
                // ОШИБКА/НЕТ СОВПАДЕНИЙ ИЛИ ПУСТАЯ БАЗА
                if (noodleDatabase.length === 0) {
                    // Ошибка загрузки базы данных (критическая)
                    let errorTitle = "⚠️ Ошибка Базы Данных!";
                    let errorMessage = "Не удалось загрузить или обработать данные меню.";
                    let errorHTML = `
                        <div class="p-6 bg-red-100 border border-red-300 rounded-xl shadow-lg text-center">
                            <h2 class="text-2xl font-bold text-red-800 mb-3">${errorTitle}</h2>
                            <p class="text-gray-700">${errorMessage}</p>
                        </div>
                    `;
                    setMainContent(errorHTML);
                } else if (currentState.step === -2) {
                    // 🔑 НЕТ СОВПАДЕНИЙ (Отображаем GIF по запросу пользователя)
                    const gifUrl = konoSadGifUrl;
                    
                    let errorHTML = `
                        <div class="text-center p-8 flex flex-col items-center justify-center min-h-[300px] fade-in">
                            <!-- Mascot Sad GIF -->
                            <div class="flex justify-center mb-6">
                                <img src="${gifUrl}" alt="Маскот Коно расстроен" 
                                    onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" 
                                    class="w-48 h-48 rounded-full object-cover border-4 border-red-400 p-0.5 shadow-xl">
                            </div>

                            <!-- Sad Message -->
                            <div class="bg-red-100 p-4 rounded-xl shadow-lg border-2 border-red-300">
                                <h2 class="text-2xl font-bold text-red-800 mb-2">😭 О нет!</h2>
                                <p class="text-xl text-gray-700 font-semibold">По вашим критериям ничего не нашлось.</p>
                                <p class="text-base text-gray-500 mt-2">Попробуйте начать заново, выбрав другие предпочтения!</p>
                            </div>
                        </div>
                    `;
                    setMainContent(errorHTML);
                } else {
                    // Общий запасной вариант ошибки
                    let errorHTML = `<div class="p-6 bg-red-100 border border-red-300 rounded-xl shadow-lg text-center"><h2 class="text-2xl font-bold text-red-800 mb-3">🙁 Упс!</h2><p class="text-gray-700">Произошла неизвестная ошибка.</p></div>`;
                     setMainContent(errorHTML);
                }
            }
            renderControls();
        }
        
        /**
         * Отображает промежуточный экран "Думаю" перед финальной рекомендацией.
         */
        function renderThinkingScreen(selectedNoodle) {
            const gifUrl = konoThinkingProcessGifUrl;
            
            const thinkingHTML = `
                <div class="text-center p-8 flex flex-col items-center justify-center min-h-[300px] fade-in">
                    <!-- Mascot Thinking GIF -->
                    <div class="flex justify-center mb-6">
                        <img src="${gifUrl}" alt="Маскот Коно, думает над рекомендацией" 
                             onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" 
                             class="w-48 h-48 rounded-full object-cover border-4 border-indigo-400 p-0.5 shadow-xl">
                    </div>

                    <!-- Thinking Message -->
                    <div class="bg-indigo-50 p-4 rounded-xl shadow-lg border-2 border-indigo-200">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">🤔 Я вас понял!</h2>
                        <p class="text-xl text-indigo-600 font-semibold">Дайте подумать...</p>
                    </div>

                    <!-- Loading Spinner -->
                    <div class="mt-4 flex items-center">
                        <div class="spinner mr-3"></div>
                        <p class="text-sm text-gray-500">Генерирую идеальный выбор...</p>
                    </div>
                </div>
            `;
            
            setMainContent(thinkingHTML);
            renderControls(); // Скрывает кнопку "Начать сначала" на время.

            // Автоматический переход к финальной рекомендации через 4 секунды (4000 мс)
            setTimeout(() => {
                // Переходим к финальному рендерингу
                currentState.step = -3; 
                renderFinalRecommendation(selectedNoodle);
            }, 4000); 
        }


        /**
         * Отображает финальный экран с деталями.
         */
        function renderFinalRecommendation(selectedNoodle) {
            // 🔑 Используем Result GIF для финального экрана
            const gifUrl = konoResultGifUrl;
            
             // 1. Выводим рекомендации по топпингам
            let toppingSuggestionHTML;
            if (selectedNoodle.toppings_ru.length > 0) {
                const toppingsList = selectedNoodle.toppings_ru.map(t => `<li class="text-gray-700">${t}</li>`).join(''); 
                toppingSuggestionHTML = `
                    <p class="font-bold text-gray-900 mb-2 border-b pb-2">🥘 Рекомендованные топпинги:</p>
                    <ul class="list-disc list-inside ml-4 mt-2 text-gray-700 text-base space-y-1">${toppingsList}</ul>
                `;
            } else {
                toppingSuggestionHTML = `
                    <p class="font-medium text-gray-600">Нет специфических рекомендаций по топпингам. Выбирайте любой по вкусу!</p>
                `;
            }

            const finalHTML = `
                <div class="text-center fade-in">
                    <!-- Mascot Thinking GIF (New Card-style Header) -->
                    <div class="flex justify-center mb-6">
                        <img src="${gifUrl}" alt="Маскот Коно, дающий рекомендацию" 
                             onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" 
                             class="w-40 h-40 rounded-full object-cover border-4 border-green-300 p-0.5 shadow-xl">
                    </div>

                    <!-- Speech Bubble/Title -->
                    <div class="bg-green-100 p-4 rounded-xl shadow-lg border-2 border-green-300 mb-6">
                        <h2 class="text-2xl font-extrabold text-green-800">✅ Найдено!</h2>
                        <p class="text-lg text-gray-700 mt-1">Идеальное блюдо для вас:</p>
                    </div>

                    <!-- Recommendation Card (Styled for clarity) -->
                    <div class="p-6 bg-white rounded-2xl shadow-xl border border-gray-100 text-left">
                        <h3 class="text-3xl font-bold text-indigo-700 mb-4 text-center border-b pb-3">${selectedNoodle.name_ru}</h3>
                        
                        <div class="grid grid-cols-2 gap-4 text-base text-gray-700 pt-2">
                            <!-- Details -->
                            <div class="col-span-1">
                                <p class="font-semibold text-gray-900 mb-1">🍜 Способ:</p>
                                <p>${selectedNoodle.preparation_ru}</p>
                            </div>
                            <div class="col-span-1">
                                <p class="font-semibold text-gray-900 mb-1">🌶️ Острота:</p>
                                <p>${selectedNoodle.spiceLevel_ru}</p>
                            </div>
                            <div class="col-span-2 mt-2">
                                <p class="font-semibold text-gray-900 mb-1">🍲 Вкус:</p>
                                <p>${selectedNoodle.baseFlavor_ru}</p>
                            </div>
                        </div>

                        <!-- Toppings Section -->
                        <div class="mt-6 pt-4 border-t border-gray-200">
                            ${toppingSuggestionHTML} 
                        </div>
                    </div>
                </div>
            `;
            setMainContent(finalHTML);
            renderControls();
        }

        /**
         * Рендерит кнопки управления (Начать / Начать сначала).
         */
        function renderControls() {
            controlArea.innerHTML = '';

            let button;
            if (currentState.step === 0) {
                button = createButton('Начать выбор', () => {
                    currentState.step = 1;
                    startNextStep();
                }, 'bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-full w-full user-button flex items-center justify-center'); // Добавлен flex
            } else if (currentState.step < 0) {
                 button = createButton('Начать сначала', restart, 'bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-full user-button flex items-center justify-center'); // Добавлен flex
            } 
            // Кнопка не отображается на шагах с вопросами (1, 2, 3) и во время "думаю" (-4), так как кнопки выбора находятся в mainArea

            if (button) {
                controlArea.appendChild(button);
            }
        }


        // --- LOGIC FUNCTIONS ---

        /**
         * Основная функция инициализации и управления заставкой.
         */
        async function startGreeting() {
            const splashScreen = document.getElementById('splash-screen');
            const splashImage = document.getElementById('splash-image');
            const mainContent = document.getElementById('main-app-content');
            
            // 1. URL GIF для Launch/Splash установлен прямо в HTML.
            
            // 2. Убеждаемся, что основной контент скрыт и показываем заставку
            mainContent.classList.add('hidden');
            splashScreen.classList.remove('hidden');
            splashScreen.style.opacity = '1';

            // 3. Асинхронная загрузка данных (с минимальной задержкой)
            const dataLoadPromise = loadNoodleDatabase();
            // Минимальное время отображения заставки (5000 мс)
            const minTimePromise = new Promise(resolve => setTimeout(resolve, 5000));

            // Ждем завершения обоих: загрузки данных И минимального времени
            await Promise.all([dataLoadPromise, minTimePromise]);

            noodleDatabase = await dataLoadPromise; // Получаем результат загрузки
            
            // Определяем продолжительность перехода (из CSS: 0.7s)
            const transitionDuration = 700; 

            // Инициализируем доступные варианты всей базой данных
            currentState.availableNoodles = [...noodleDatabase];

            // 4. Плавное скрытие заставки
            splashScreen.style.opacity = '0';
            
            // 5. Запуск приложения или показ ошибки, если база пуста
            if (noodleDatabase.length === 0) {
                currentState.step = -2;
                mainContent.classList.remove('hidden');
                renderResult(); // Отображаем ошибку
            } else {
                currentState.step = 0;
                // Делаем основной контент видимым
                mainContent.classList.remove('hidden'); 
                renderStartScreen(); // Отображаем начальный экран (контент внутри будет анимирован через fade-in)
            }
            
            // 6. Полностью скрываем элемент заставки после завершения fade-out
            setTimeout(() => {
                splashScreen.classList.add('hidden'); 
            }, transitionDuration); 
        }

        function handleAnswer(key, value) {
            // Удаляем кнопки выбора после ответа
            setMainContent('');

            currentState.filters[key] = value;
            currentState.availableNoodles = currentState.availableNoodles.filter(noodle => noodle[key] === value);
            
            currentState.step++;
            startNextStep();
        }

        function startNextStep() {
            // 1. Проверка на отсутствие совпадений
            if (currentState.availableNoodles.length === 0) {
                currentState.step = -2;
                renderResult(); 
                return;
            }

            // 2. Проверка на завершение вопросов
            if (currentState.step > questionFlow.length) {
                currentState.step = -1; // Переходим к выбору из нескольких
                renderResult(); 
                return;
            }
            
            // 3. Обработка текущего вопроса
            const currentQuestion = questionFlow[currentState.step - 1];
            let options = currentQuestion.options_ru;
            
            if (currentQuestion.options_source === "dynamic_from_filter") {
                const remainingFlavors = [...new Set(currentState.availableNoodles.map(n => n[currentQuestion.key]))];
                options = remainingFlavors.sort(); 
            }

            if (options.length === 0) {
                currentState.step = -2;
                renderResult();
                return;
            }

            // 4. Логика авто-перехода (если остался 1 вариант)
            if (options.length === 1 && currentState.step < questionFlow.length) {
                // Если остался только один вариант для следующего вопроса, автоматически выбираем его
                currentState.filters[currentQuestion.key] = options[0];
                currentState.availableNoodles = currentState.availableNoodles.filter(noodle => noodle[currentQuestion.key] === options[0]);
                currentState.step++;
                startNextStep();
                return;
            } 
            
            // 5. Задаем вопрос
            renderQuestionStep(currentQuestion, options);
        }

        function handleNoodleSelection(noodleId) {
            const selectedNoodle = noodleDatabase.find(n => n.id === noodleId);

            if (!selectedNoodle) {
                currentState.step = -2;
                renderResult();
                return;
            }
            
            // Переходим к экрану "Думаю" перед финальной рекомендацией
            renderThinkingScreen(selectedNoodle);
        }

        function restart() {
            // Сбрасываем состояние
            currentState = {
                step: 0,
                filters: {},
                availableNoodles: []
            };
            // Инициализируем доступные варианты для нового старта
            currentState.availableNoodles = [...noodleDatabase];
            renderStartScreen();
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', startGreeting);

    </script>

</body>
</html>

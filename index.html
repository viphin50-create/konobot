<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рамён-Помощник КОНО</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Настройка шрифта Inter и стилей для красивого внешнего вида -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf8e3; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            position: relative;
        }
        
        /* --- ЭКРАН ЗАПУСКА (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fcf8e3;
            z-index: 9999;
            transition: opacity 0.5s ease-out; /* Плавное исчезновение */
            display: flex; 
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .splash-text {
            color: #4f46e5;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* --- КОНЕЦ СТИЛЕЙ SPLASH SCREEN --- */

        /* --- СТИЛИ ДЛЯ КАРТОЧКИ ПРИЛОЖЕНИЯ (ЭФФЕКТ СТЕКЛА) --- */
        .glass-card {
            background-color: #fcf8e3; 
            border: 1px solid rgba(0, 0, 0, 0.05); 
        }

        /* Анимации */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }
        
        /* CSS Spinner для загрузки */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #4f46e5; /* indigo-600 */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Стили для резервного маскота (если GIF не загрузился) */
        .fallback-mascot {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem; 
            background-color: #eef2ff; 
            color: #4f46e5; 
            font-weight: bold;
        }
        
        /* Стили для карточек результатов */
        .noodle-card-grid {
             /* Применяем тень и плавный эффект при наведении для каждой карточки */
             box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
             transition: all 0.2s ease-in-out;
             cursor: pointer;
        }
        .noodle-card-grid:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    
    <!-- --- ЭКРАН ЗАПУСКА (SPLASH SCREEN) --- -->
    <div id="splash-screen">
        <!-- Используем прежний GIF для экрана запуска -->
        <img 
            src="https://image2url.com/gifs/1764740376136-5dafd80b-3e40-47c9-b076-32f156c929a8.gif" 
            onerror="this.onerror=null; this.src='https://placehold.co/192x192/4f46e5/ffffff?text=КОНО'; this.style.borderRadius='50%'; this.style.objectFit='cover';"
            alt="Маскот Коно приветствует" 
            class="w-48 h-48 rounded-full object-cover border-4 border-indigo-400 p-0.5 shadow-xl mb-6">
        <div class="flex items-center">
            <div class="spinner"></div>
            <p class="text-xl splash-text">Загружаю базу рамёнов...</p>
        </div>
    </div>
    <!-- ----------------------------------- -->

    <!-- Основной контент приложения -->
    <div id="main-app-content" class="w-full max-w-lg mx-auto p-6 md:p-8 rounded-2xl glass-card opacity-0 hidden">
        <!-- Header -->
        <header class="mb-6 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-gray-800">🍜 Рамён-Помощник</h1>
            <p class="text-sm text-gray-500">Ваш личный консультант по меню</p>
        </header>

        <!-- Main Dynamic Interaction Area -->
        <div id="main-interaction-area" class="space-y-6 pb-4 fade-in">
            <!-- Контент будет загружен после скрытия splash-screen -->
        </div>

        <!-- Control Buttons Area -->
        <div id="control-area" class="mt-6 pt-4 border-t border-gray-200 flex justify-center">
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО (MODAL) -->
    <!-- Обновленные стили для прокрутки на мобильных устройствах: overflow-y-auto и p-4 sm:p-8 для отступов -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden flex justify-center items-center p-4 sm:p-8 opacity-0 transition-opacity duration-300 bg-black bg-opacity-50 backdrop-blur-sm overflow-y-auto">
        <!-- Обновленные стили для ограничения высоты и прокрутки контента: max-h-[95vh] и overflow-y-auto -->
        <div id="modal-content" class="bg-white w-full max-w-sm rounded-3xl shadow-2xl transform scale-95 transition-transform duration-300 my-auto max-h-[95vh] overflow-y-auto">
            <div id="modal-body"></div>
            <!-- Кнопка закрытия, чтобы она всегда была видна, даже если модальное окно прокручивается -->
            <button onclick="closeModal()" class="absolute top-3 right-3 bg-white rounded-full p-1 shadow-md hover:bg-gray-100 z-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ДАННЫХ И ИСТОЧНИК (GOOGLE SHEETS) ---
        // Ссылка на CSV Google Sheets (должна быть опубликована)
        // ИСПРАВЛЕНО: Обновлена ссылка, чтобы избежать ошибки 404
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRnB4au4-MszdpetvxpPpP_ic1lXC7w-2CNGyXqDa4ABC7-gCTQCaehv2Rs6XNMr3hweVIqm2cen2SW/pub?output=csv';
        const PLACEHOLDER_IMAGE = "https://placehold.co/100x100/1e293b/ffffff?text=Фото+Нет";
        
        // --- Fallback Data (резервные данные) ---
        const FALLBACK_DATA = [
            {
                id: 'shin_ramyun_fallback',
                name_ru: 'Shin Ramyun (Классический)',
                image: 'https://placehold.co/100x100/EF4444/FFFFFF?text=Shin',
                preparation_ru: 'С бульоном', 
                spiceLevel_ru: 'Средняя',
                baseFlavors_ru: ['Говядина', 'Классика'],
                cookingTime_ru: '5', 
                toppings_ru: ['Яйцо', 'Кимчи', 'Зеленый лук']
            },
            {
                id: 'buldak_2x_fallback',
                name_ru: 'Buldak (2x Острый)',
                image: 'https://placehold.co/100x100/F97316/FFFFFF?text=Buldak',
                preparation_ru: 'Без бульона', 
                spiceLevel_ru: 'Острая',
                baseFlavors_ru: ['Курица', 'Острое'],
                cookingTime_ru: '15', 
                toppings_ru: ['Сыр', 'Кунжут', 'Нори']
            },
            {
                id: 'jjapagetti_fallback',
                name_ru: 'Jjapagetti',
                image: 'https://placehold.co/100x100/4B5563/FFFFFF?text=Jjap',
                preparation_ru: 'Без бульона', 
                spiceLevel_ru: 'Не острая',
                baseFlavors_ru: ['Черные бобы', 'Паста'],
                cookingTime_ru: '7', 
                toppings_ru: ['Огурцы', 'Масло', 'Говядина']
            }
        ];

        // Поток вопросов
        const questionFlow = [
            { key: 'preparation_ru', prompt_ru: "С чего начнем? Вы любите рамён <b>с бульоном</b> или предпочитаете <b>без бульона</b>?", options_ru: ["С бульоном", "Без бульона"], isMultiValue: false },
            { key: 'spiceLevel_ru', prompt_ru: "Как насчет остроты? Выберите свой уровень:", options_ru: ["Не острая", "Средняя", "Острая"], isMultiValue: false },
            { key: 'baseFlavors_ru', prompt_ru: "Отлично. А какой вкус вы ищете сегодня?", options_source: "dynamic_from_filter", isMultiValue: true } 
        ];

        // --- GIF CONFIG (URLs для разных состояний маскота) ---
        const videoUrls = {
            'greeting': 'https://image2url.com/gifs/1764740584038-dcde9c54-af2e-449c-8219-c083e3301721.gif', // Новый GIF приветствия
            'questionGif': 'https://image2url.com/gifs/1764741716055-e2369ce9-cef3-4743-b5c5-c4e93dd4f444.gif', // GIF для вопросов (который делаем круглым)
            'thinking': 'https://image2url.com/gifs/1764738669270-394beae2-99fc-4a8c-b4c4-b619b62d3538.gif',
            'sad': 'https://image2url.com/gifs/1764740291026-67f3930a-6d5f-453b-b9c4-0e094200e7e0.gif', // GIF для ошибки/нет результатов
            'fallback': 'https://placehold.co/192x192/4f46e5/ffffff?text=Коно' 
        };

        // --- STATE (Состояние приложения) и DOM ELEMENTS ---
        let noodleDatabase = []; 
        let isFallbackData = false; 
        // ДОБАВЛЕНО: Флаг для отслеживания, был ли первый запуск завершен.
        let isInitialLoadComplete = false;
        
        let currentState = { 
            step: 0, 
            filters: {}, 
            availableNoodles: []
        };
        
        const mainAppContent = document.getElementById('main-app-content');
        const splashScreen = document.getElementById('splash-screen');
        const mainArea = document.getElementById('main-interaction-area');
        const controlArea = document.getElementById('control-area');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const modalBody = document.getElementById('modal-body');

        // Словарь для отображения иконок в кнопках
        const optionIcons = {
            "С бульоном": "🍲", "Без бульона": "🍜",
            "Не острая": "🟢", "Средняя": "🌶️🌶️", "Острая": "🌶️🌶️🌶️",
            "Черные бобы": "⚫", "Морепродукты": "🦐", "Кимчи": "🥬", "Курица": "🍗", 
            "Говядина": "🥩", "Паста": "🍝", "Карбонара": "🧀", "Классика": "✨",
            "Острое": "🔥",
            "default": "✨"
        };
        
        // --- ФУНКЦИЯ ПАРСИНГА CSV ---
        function csvToJSON(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(header => header.trim());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '') continue;
                // Использование регулярного выражения для обработки запятых внутри кавычек, если бы они были. 
                // Здесь полагаемся на то, что поля не содержат запятых, т.к. это простой CSV.
                const currentline = line.split(',');
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = currentline[j] ? currentline[j].trim() : '';
                }
                result.push(obj);
            }
            return result;
        }

        // --- ФУНКЦИЯ ЗАГРУЗКИ ДАННЫХ ИЗ GOOGLE SHEETS ---
        async function loadNoodleDatabase() {
            let fallbackUsed = false;
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const csvText = await response.text();
                const rawData = csvToJSON(csvText);

                const mappedData = rawData.map(item => {
                    const toppings = [];
                    for (const key in item) {
                        if (key.startsWith('Topping') && item[key] && item[key].trim() !== '') {
                            toppings.push(item[key].trim());
                        }
                    }
                    
                    // --- ЛОГИКА ДЛЯ ВКУСОВ (ОБЪЕДИНЕНИЕ Flavor 1 и Flavor 2) ---
                    const baseFlavors = [];
                    // Читаем Flavor 1 и Flavor 2 (с учетом того, что заголовки в CSV могут содержать пробелы)
                    const flavor1 = item['Flavor 1'] ? item['Flavor 1'].trim() : '';
                    const flavor2 = item['Flavor 2'] ? item['Flavor 2'].trim() : '';
                    
                    if (flavor1.length > 0) baseFlavors.push(flavor1);
                    // Добавляем Flavor 2, только если он не пустой и не является дубликатом Flavor 1 (на всякий случай)
                    if (flavor2.length > 0 && flavor2 !== flavor1) baseFlavors.push(flavor2);
                    // -----------------------------------------------------------------

                    return {
                        id: (item.Name || 'unknown').toLowerCase().replace(/[^a-zа-я0-9]/g, '_') + '_' + Math.random().toString(36).substring(2, 5),
                        name_ru: item.Name || 'Неизвестное блюдо',
                        image: item.Photo || PLACEHOLDER_IMAGE,
                        preparation_ru: item.Method || 'С бульоном', 
                        spiceLevel_ru: item.Spiciness || 'Не острая',
                        baseFlavors_ru: baseFlavors, // Используем объединенный массив для фильтрации
                        cookingTime_ru: item.CookingTime || '0', 
                        toppings_ru: toppings 
                    };
                }).filter(item => item.name_ru !== 'Неизвестное блюдо'); 
                
                if (mappedData.length === 0) {
                     fallbackUsed = true;
                     return { data: FALLBACK_DATA, isFallback: fallbackUsed };
                }
                return { data: mappedData, isFallback: fallbackUsed };

            } catch (error) {
                console.error("Failed to load data from Google Sheets. Using fallback data.", error);
                fallbackUsed = true;
                return { data: FALLBACK_DATA, isFallback: fallbackUsed }; 
            }
        }
        
        function setMainContent(html) { mainArea.innerHTML = html; }

        // Создание интерактивной кнопки
        function createButton(text, onClick, classes = 'bg-white text-gray-800 border-2 border-indigo-200 hover:bg-indigo-100 font-medium py-3 px-6 rounded-xl user-button flex-grow text-center flex items-center justify-center') {
            const btn = document.createElement('button');
            const icon = optionIcons[text] || optionIcons['default'];
            btn.innerHTML = `<span class="text-xl mr-2">${icon}</span> ${text}`;
            btn.className = classes;
            btn.onclick = onClick;
            return btn;
        }

        // --- ИНИЦИАЛИЗАЦИЯ И СКРЫТИЕ SPLASH-SCREEN ---
        async function initializeApp(isRestart = false) { // ДОБАВЛЕНО: Параметр isRestart
            
            let loadResult;

            if (isRestart) {
                // Если это перезапуск, используем уже загруженную базу данных, если она есть
                if (noodleDatabase.length === 0 && !isFallbackData) {
                    // Если данных нет, загружаем их
                     loadResult = await loadNoodleDatabase();
                } else {
                    // Используем данные, которые уже есть в памяти (мгновенно)
                    loadResult = { data: noodleDatabase, isFallback: isFallbackData };
                }
                
                // Сразу устанавливаем данные и переходим к стартовому экрану без задержки
                noodleDatabase = loadResult.data;
                isFallbackData = loadResult.isFallback; 
                currentState.availableNoodles = [...noodleDatabase];
                
                // Скрываем Splash Screen (если он каким-то образом был виден)
                splashScreen.classList.add('hidden');
                // Показываем основной контент с анимацией
                mainAppContent.classList.remove('hidden', 'opacity-0');
                mainAppContent.classList.add('opacity-100');

                // Переход к первому экрану (Приветствие или Ошибка)
                if (noodleDatabase.length === 0) {
                    currentState.step = -2;
                    renderResult(); 
                } else {
                    currentState.step = 0;
                    renderStartScreen(); 
                }
                
            } else {
                // --- ЛОГИКА ПЕРВОГО ЗАПУСКА (С ЗАДЕРЖКОЙ SPLASH SCREEN) ---
                const minimumDisplayTime = new Promise(resolve => setTimeout(resolve, 3000));
                
                // 2. Загружаем данные
                const dataLoadPromise = loadNoodleDatabase();

                // 3. Ждем, пока загрузятся данные И пройдет минимум 3 секунды
                [loadResult] = await Promise.all([dataLoadPromise, minimumDisplayTime]);
                
                noodleDatabase = loadResult.data;
                isFallbackData = loadResult.isFallback; 
                currentState.availableNoodles = [...noodleDatabase];
                isInitialLoadComplete = true; // Устанавливаем флаг первого запуска

                // 4. Скрываем Splash Screen (плавное затухание)
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.classList.add('hidden');
                    // 5. Показываем основной контент с анимацией
                    mainAppContent.classList.remove('hidden');
                    mainAppContent.style.opacity = '1';

                    // 6. Переход к первому экрану (Приветствие или Ошибка)
                    if (noodleDatabase.length === 0) {
                        currentState.step = -2;
                        renderResult(); 
                    } else {
                        currentState.step = 0;
                        renderStartScreen(); 
                    }
                }, 500); // 0.5 секунды для анимации fade-out
            }
        }

        // --- РЕНДЕРИНГ ЭКРАНОВ С ИСПОЛЬЗОВАНИЕМ GIF ---
        function renderStartScreen() {
            // Используем GIF для приветствия
            const gifUrl = videoUrls['greeting']; 
            const fallbackUrl = videoUrls['fallback'];
            let warningMessage = '';

            // Если были использованы резервные данные, показываем предупреждение
            if (isFallbackData) { 
                warningMessage = `
                    <div class="p-3 bg-yellow-100 border border-yellow-400 text-yellow-800 rounded-xl mb-4 text-left fade-in">
                        <p class="font-bold">⚠️ ВНИМАНИЕ: Ошибка загрузки данных</p>
                        <p class="text-sm">Не удалось загрузить меню по внешней ссылке. Отображаются старые резервные данные. Пожалуйста, убедитесь, что ссылка на таблицу корректна и опубликована в формате CSV.</p>
                    </div>
                `;
            }

            let contentHTML = `
                ${warningMessage} 
                <div class="text-center p-4">
                    <div class="flex justify-center mb-6">
                        <img 
                            src="${gifUrl}" 
                            onerror="this.onerror=null; this.src='${fallbackUrl}'; this.classList.add('fallback-mascot'); this.classList.remove('object-cover'); this.alt='Статичный Коно';"
                            alt="Маскот Коно" 
                            class="w-48 h-48 rounded-full object-cover border-4 border-indigo-300 p-0.5 shadow-lg">
                    </div>
                    <h2 class="text-2xl font-extrabold text-indigo-700 mb-2">👋 Привет! Я Коно, твой Рамён-Помощник.</h2>
                    <p class="text-gray-500 mb-6">Нажми "Начать выбор", чтобы найти идеальное блюдо для тебя.</p>
                </div>
            `;
            setMainContent(contentHTML);
            renderControls();
        }

        function renderQuestionStep(question, options) {
            // Использование НОВОГО GIF для вопросов
            const gifUrl = videoUrls['questionGif']; 
            const fallbackUrl = videoUrls['fallback'];
            let questionHTML = `
                <div class="flex items-start mb-6 space-x-4 fade-in">
                    <!-- Обновленный блок: теперь изображение круглое (w-36 h-36, rounded-full) -->
                    <img 
                        src="${gifUrl}" 
                        onerror="this.onerror=null; this.src='${fallbackUrl}'; this.alt='Статичный Коно'; this.classList.add('fallback-mascot', 'w-36', 'h-36', 'rounded-full', 'object-cover', 'border-4', 'border-indigo-300', 'p-0.5', 'shadow-lg');"
                        alt="Маскот Коно" 
                        class="flex-shrink-0 w-36 h-36 rounded-full object-cover border-4 border-indigo-300 p-0.5 shadow-lg bg-white">
                    
                    <div class="flex-grow bg-indigo-50 p-4 rounded-xl rounded-tl-none shadow-lg border-2 border-indigo-200">
                        <p class="text-sm font-bold text-indigo-700 mb-1">КОНО (Шаг ${currentState.step}/${questionFlow.length})</p>
                        <p class="text-xl font-semibold text-gray-800">${question.prompt_ru}</p>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="text-sm text-gray-500 mb-3 ml-1">Выберите свой ответ:</p>
                    <div id="option-buttons" class="flex flex-wrap gap-3"></div>
                </div>
            `;
            setMainContent(questionHTML);
            renderControls();
            const optionButtonsArea = document.getElementById('option-buttons');
            options.forEach(option => {
                optionButtonsArea.appendChild(createButton(option, () => handleAnswer(question.key, option)));
            });
        }
        
        // --- ФУНКЦИЯ ДЛЯ МОДАЛЬНОГО ОКНА ---
        function openModal(noodleId) {
            const noodle = noodleDatabase.find(n => n.id === noodleId);
            if (!noodle) return;

            const toppingsList = noodle.toppings_ru.length > 0 
                ? noodle.toppings_ru.map(t => `<li class="flex items-start"><span class="mr-2 text-green-500">✅</span>${t}</li>`).join('')
                : '<li class="text-gray-500">Любой топпинг по вашему вкусу!</li>';
            
            const flavorsTags = noodle.baseFlavors_ru.map(f => 
                `<span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-md font-medium">${f}</span>`
            ).join('');
            
            let designationBlock = '';
            
            if (noodle.preparation_ru === 'С бульоном') {
                 designationBlock = `
                    <div class="mt-4 bg-indigo-50 p-4 rounded-xl border border-indigo-200 shadow-sm">
                        <p class="font-bold text-indigo-800 mb-1 text-sm uppercase tracking-wide flex items-center">
                            <span class="text-xl mr-2">ℹ️</span> Обозначение "С бульоном"
                        </p>
                        <p class="text-sm text-gray-700">
                            Это значит, что после варки лапши 
                            <b>вода полностью не сливается</b>, и рамён подается в горячем, ароматном бульоне. 
                        </p>
                    </div>
                 `;
            } else if (noodle.preparation_ru === 'Без бульоном') {
                 designationBlock = `
                    <div class="mt-4 bg-indigo-50 p-4 rounded-xl border border-indigo-200 shadow-sm">
                        <p class="font-bold text-indigo-800 mb-1 text-sm uppercase tracking-wide flex items-center">
                            <span class="text-xl mr-2">ℹ️</span> Обозначение "Без бульона"
                        </p>
                        <p class="text-sm text-gray-700">
                            Без бульона - вода сливается после варки, специи добавляются после.
                        </p>
                    </div>
                 `;
            }

            // Изменения для компактности: py-3 px-4
            const html = `
                <div class="relative">
                    <div class="relative w-full aspect-square bg-gray-200 overflow-hidden">
                         <img src="${noodle.image}" onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" class="absolute inset-0 w-full h-full object-cover">
                    </div>
                    
                    <div class="p-4">
                        <h3 class="text-2xl font-extrabold text-gray-800 mb-1">${noodle.name_ru}</h3>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="px-2 py-1 bg-indigo-100 text-indigo-800 text-xs rounded-md font-medium">${noodle.preparation_ru}</span>
                            <span class="px-2 py-1 bg-orange-100 text-orange-800 text-xs rounded-md font-medium">${noodle.spiceLevel_ru}</span>
                            ${flavorsTags} 
                        </div>
                        
                        ${designationBlock}

                        <div class="mt-4 bg-yellow-50 py-3 px-4 rounded-xl border border-yellow-200 shadow-sm text-center">
                            <p class="font-bold text-yellow-800 mb-1 text-sm uppercase tracking-wide">Режим Варки</p>
                            <p class="text-5xl font-extrabold text-gray-900">${noodle.cookingTime_ru}</p>
                        </div>

                        <div class="mt-4 bg-green-50 py-3 px-4 rounded-xl border border-green-100">
                            <p class="font-bold text-green-800 mb-2 text-sm uppercase tracking-wide">Рекомендую попробовать с нашими топпингами:</p>
                            <ul class="space-y-1 text-sm text-gray-700 list-none pl-0">${toppingsList}</ul>
                        </div>
                    </div>
                    
                    <div class="p-4 bg-gray-50 border-t border-gray-100 text-center rounded-b-3xl">
                        <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded-xl w-full transition-colors">Отлично, спасибо</button>
                    </div>
                </div>
            `;
            modalBody.innerHTML = html;
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modalOverlay.classList.add('hidden'); }, 300);
        }
        // Убедимся, что клик по оверлею работает, проверяя, что e.target - это именно сам оверлей (а не его дочерний элемент)
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        // --- ЭКРАН "ДУМАЮ" ---
        function showThinkingAndRenderResults() {
            const gifUrl = videoUrls['thinking'];
            const fallbackUrl = videoUrls['fallback'];
            
            const thinkingHTML = `
                <div class="text-center p-8 flex flex-col items-center justify-center min-h-[300px] fade-in">
                    <div class="flex justify-center mb-6">
                        <img 
                            src="${gifUrl}" 
                            onerror="this.onerror=null; this.src='${fallbackUrl}'; this.classList.add('fallback-mascot'); this.classList.remove('object-cover'); this.alt='Статичный Коно';"
                            alt="Маскот Коно думает" 
                            class="w-48 h-48 rounded-full object-cover border-4 border-indigo-400 p-0.5 shadow-xl">
                    </div>
                    <div class="bg-indigo-50 p-4 rounded-xl shadow-lg border-2 border-indigo-200">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">🤔 Я вас понял!</h2>
                        <p class="text-xl text-indigo-600 font-semibold">Дайте подумать...</p>
                    </div>
                    <div class="mt-4 flex items-center">
                        <p class="text-sm text-gray-500">Генерирую идеальный выбор...</p>
                    </div>
                </div>
            `;
            
            setMainContent(thinkingHTML);
            renderControls(); 

            setTimeout(() => {
                currentState.step = -1; 
                renderResult();
            }, 3000); 
        }

        // --- RENDER RESULTS AS CARDS (Отображение карточек с результатами В ВИДЕ СЕТКИ) ---
        function renderResult() {
            const list = currentState.availableNoodles;
            const fallbackUrl = videoUrls['fallback'];

            // Сценарий 1 и 2: Ошибка или ничего не найдено
            if (noodleDatabase.length === 0 || list.length === 0) {
                 const gifUrl = videoUrls['sad']; // Используем GIF для ошибки/нет результатов
                 let errorTitle = (list.length === 0) ? "😭 О нет!" : "⚠️ Ошибка Загрузки";
                 let errorText = (list.length === 0) ? "По вашим критериям ничего не нашлось. Попробуйте снова!" : "Не удалось загрузить меню. Пожалуйста, проверьте, что ваша ссылка на Google Sheets опубликована.";
                 
                 let errorHTML = `
                    <div class="text-center p-8 fade-in">
                        <div class="flex justify-center mb-6">
                            <img 
                                src="${gifUrl}" 
                                onerror="this.onerror=null; this.src='${fallbackUrl}'; this.classList.add('fallback-mascot'); this.classList.remove('object-cover'); this.alt='Статичный Коно';"
                                class="w-48 h-48 rounded-full object-cover border-4 border-red-400 p-0.5 shadow-xl" alt="Маскот Коно грустит">
                        </div>
                        <div class="bg-red-100 p-4 rounded-xl border-2 border-red-300">
                            <h2 class="text-2xl font-bold text-red-800 mb-2">${errorTitle}</h2>
                            <p class="text-gray-700">${errorText}</p>
                        </div>
                    </div>
                 `;
                 currentState.step = -2; 
                 setMainContent(errorHTML);
                 renderControls();
                 return;
            }

            // Сценарий 3: Успешный результат (Отображаем сетку)
            const gifUrl = videoUrls['greeting'];
            let resultHTML = `
                <div class="text-center mb-6 fade-in">
                    <div class="flex justify-center mb-4">
                         <img 
                            src="${gifUrl}" 
                            onerror="this.onerror=null; this.src='${fallbackUrl}'; this.classList.add('fallback-mascot'); this.classList.remove('object-cover'); this.alt='Статичный Коно';"
                            class="w-32 h-32 rounded-full object-cover border-4 border-green-300 p-0.5 shadow-lg" alt="Маскот Коно рад">
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Готово! Вот что я нашел:</h2>
                    <p class="text-sm text-gray-500 mt-1">Нажмите на карточку, чтобы увидеть детали и код варки.</p>
                </div>
                
                <!-- Адаптивная СЕТКА для результатов -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 fade-in">
            `;

            list.forEach(noodle => {
                const flavorTags = noodle.baseFlavors_ru.slice(0, 2).map(f => // Показываем только 2 тега, чтобы не перегружать сетку
                    `<span class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded-full font-medium">${f}</span>`
                ).join('');

                resultHTML += `
                    <div class="glass-card rounded-xl overflow-hidden p-3 noodle-card-grid" onclick="openModal('${noodle.id}')">
                         <div class="flex items-center w-full">
                            <div class="flex-shrink-0 w-16 h-16 bg-gray-100 rounded-lg overflow-hidden mr-4"> 
                                <img src="${noodle.image}" onerror="this.onerror=null; this.src='${PLACEHOLDER_IMAGE}';" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-grow min-w-0"> 
                                <h3 class="font-bold text-gray-800 text-base leading-tight">${noodle.name_ru}</h3>
                                <div class="flex flex-wrap gap-1 mt-1">
                                    <span class="text-[10px] px-1.5 py-0.5 bg-indigo-50 text-indigo-600 rounded-full font-medium">${noodle.spiceLevel_ru}</span>
                                    ${flavorTags}
                                </div>
                            </div>
                            <!-- Иконка для кликабельности -->
                            <svg class="flex-shrink-0 ml-3 h-6 w-6 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </div>
                    </div>
                `;
            });
            
            resultHTML += `</div>`; 
            setMainContent(resultHTML);
            renderControls();
        }
        
        // --- CONTROL BUTTONS (Отображение кнопок управления) ---
        function renderControls() {
            controlArea.innerHTML = '';
            let button;
            if (currentState.step === 0) {
                button = createButton('Начать выбор', () => {
                    currentState.step = 1;
                    startNextStep();
                }, 'bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-full w-full user-button flex items-center justify-center');
            } else if (currentState.step < 0) {
                 button = createButton('Начать сначала', restart, 'bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-full user-button flex items-center justify-center');
            } 
            if (button) controlArea.appendChild(button);
        }

        // Обработка ответа пользователя
        function handleAnswer(key, value) {
            setMainContent(''); 
            currentState.filters[key] = value;
            
            const question = questionFlow.find(q => q.key === key);

            if (question && question.isMultiValue) {
                // Фильтрация для мультизначных полей (например, baseFlavors_ru)
                currentState.availableNoodles = currentState.availableNoodles.filter(noodle => 
                    noodle[key].includes(value)
                );
            } else {
                // Фильтрация для однозначных полей (например, preparation_ru)
                currentState.availableNoodles = currentState.availableNoodles.filter(noodle => 
                    noodle[key] === value
                );
            }

            currentState.step++;
            startNextStep();
        }

        // Переход к следующему шагу (вопросу или результатам)
        function startNextStep() {
            if (currentState.availableNoodles.length === 0) {
                currentState.step = -2;
                renderResult(); 
                return;
            }

            if (currentState.step > questionFlow.length) {
                showThinkingAndRenderResults(); 
                return;
            }
            
            const currentQuestion = questionFlow[currentState.step - 1];
            let options = currentQuestion.options_ru;
            
            if (currentQuestion.options_source === "dynamic_from_filter") {
                if (currentQuestion.isMultiValue) {
                    // Собираем все уникальные вкусы из оставшихся вариантов
                    const allFlavors = currentState.availableNoodles.flatMap(n => n[currentQuestion.key]);
                    options = [...new Set(allFlavors)].sort(); 
                } else {
                    const remainingValues = [...new Set(currentState.availableNoodles.map(n => n[currentQuestion.key]))];
                    options = remainingValues.sort(); 
                }
            }

            if (options.length === 0) {
                currentState.step = -2;
                renderResult();
                return;
            }

            // Если остался только один вариант, пропускаем вопрос и переходим к следующему шагу
            if (options.length === 1 && currentState.step < questionFlow.length) {
                handleAnswer(currentQuestion.key, options[0]); 
                return;
            } 
            
            renderQuestionStep(currentQuestion, options);
        }

        // Сброс состояния и начало заново
        function restart() {
            currentState = { step: 0, filters: {}, availableNoodles: [] };
            // ПЕРЕМЕНА: Передаем true, чтобы пропустить задержку splash screen
            initializeApp(true); 
        }

        // Запуск приложения после загрузки DOM
        document.addEventListener('DOMContentLoaded', () => initializeApp(false)); // Передаем false для первого запуска
    </script>
</body>
</html>
